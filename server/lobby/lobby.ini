; openwbc3 lobby server settings (every key is also a command-line flag: -listen, -enableRelay, ...).
[Lobby]
; UDP address of the lobby: ":24860" serves IPv4 and IPv6 on that port.
Listen = :24860
; The read-only web page (games, players; never addresses). Empty: off.
WebListen = :8080
; 1: addresses appear in the log (for debugging; they are personal data).
LogSensitiveData = 0
; A game disappears this many seconds after its host's last refresh.
GameTimeout = 20
; How often hosts refresh their game (ms); must be shorter than GameTimeout.
RefreshMs = 5000
MaxGames = 1000
; Games from one IPv4 address or IPv6 /64.
MaxGamesPerAddress = 4
; Requests per second from one IPv4 address or IPv6 /64 (bursts of twice that).
RequestsPerSecond = 20
; The relay forwards a game's datagrams when hole punching fails. It costs bandwidth: switch it off with 0.
EnableRelay = 1
MaxRelays = 100
MaxRelaysPerAddress = 2
; Per relayed player, both directions together (a 6-player lockstep game needs a few KB/s).
RelayBytesPerSecond = 32768
RelayIdleTimeout = 30
Title = openwbc3 games
